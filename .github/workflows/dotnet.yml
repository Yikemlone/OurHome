# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x

      - name: Dotnet EF Tool Install
        run: dotnet tool install --global dotnet-ef --version 6.0.6

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Set SQL Database
        run: docker run -e 'ACCEPT_EULA=Y' -e 'SA_PASSWORD=YourPass@word' -p 1433:1433 --name OurHomeCDB -d mcr.microsoft.com/mssql/server:2019-latest

      - name: Database Migrations
        run: |
          dotnet ef migrations add "$(date +'%m%d%y')" -p ./OurHomeApp/OurHome.DataAccess -s ./OurHomeApp/OurHome.Server
          dotnet ef database update -s ./OurHomeApp/OurHome.Server

      - name: Test
        run: dotnet test --no-build --verbosity normal
